<div class="container mt-3">
  <h3>{{titulo}}</h3>

  <div *ngIf="isLoading" class="d-flex justify-content-center text-primary mt-4">
    <div class="spinner-border" role="status">
    </div>
  </div>

  <div *ngIf="!isLoading && data.length === 0" class="empty-table">
    <p class="text-center text-muted">Nenhum registro encontrado.</p>
  </div>

  <table *ngIf="!isLoading && data.length > 0" class="table table-striped mt-3">
    <thead>
      <tr>
        <th *ngFor="let col of columns" scope="col">{{ col.label }}</th>
        <th scope="col">Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of data; let i = index">
        <td *ngFor="let col of columns">{{ item[col.key] }}</td>
        <td>
          <button class="btn btn-warning btn-sm me-1" (click)="editItem(i)">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-danger btn-sm" (click)="removeItem(i)">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
