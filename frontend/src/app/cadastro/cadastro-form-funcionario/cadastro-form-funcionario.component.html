<div class="container medico">
  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-primary" (click)="openModal()">
      <i class="bi bi-plus-square fs-5"></i>
      Adicionar Funcionário
    </button>
  </div>

  <div class="mt-3">
    <app-todo-list-generic
      [columns]="columns"
      [titulo]="'Lista de Funcionários'"
      [data]="funcionarios"
      (editEvent)="openModal($event)"
      (deleteEvent)="removeFuncionario($event)">
    </app-todo-list-generic>
  </div>
</div>
